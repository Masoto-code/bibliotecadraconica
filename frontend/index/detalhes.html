<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Livro - Biblioteca Dracônica</title>
    <link rel="stylesheet" href="..css/style.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <a href="index.html">
                <img class="icon" src="../icones/logo.png" alt="BD.icon">
            </a>
            <p class="texto-logo">Biblioteca <br>Dracônica</p>
        </div>

        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="livros.html">Catálogo</a></li>
                <li><a href="cadastro.html">Cadastrar Livro</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <article class="detalhes-container">
            <div class="capa-box">
                <img id="capaLivro" src="https://via.placeholder.com/250x350" alt="Capa do Livro">
            </div>

            <div class="info-box">
                <h1 id="tituloLivro">Carregando Título...</h1>
                <p><strong>Autor/Editora:</strong> <span id="autorLivro">-</span></p>
                <p><strong>Sistema:</strong> <span id="sistemaLivro">-</span></p>
                
                <h3>Sinopse</h3>
                <p id="descricaoLivro">Carregando descrição...</p>

                <!-- Avaliação por Estrelas -->
                <div class="avaliacao-container">
                    <h3>Avaliar este tomo:</h3>
                    <div class="estrelas" id="estrellasBox">
                        <span class="estrela" data-value="1">★</span>
                        <span class="estrela" data-value="2">★</span>
                        <span class="estrela" data-value="3">★</span>
                        <span class="estrela" data-value="4">★</span>
                        <span class="estrela" data-value="5">★</span>
                    </div>
                </div>

                <!-- Botão de Download -->
                <div class="download-container">
                    <a id="btnDownload" href="#" download class="btn-download">
                        📥 Baixar PDF do Livro
                    </a>
                </div>
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Biblioteca Dracônica - Todos os direitos reservados</p>
    </footer>

    <!-- Scripts da página -->
    <script src="../js/download.js"></script>
    <script src="../js/avaliacao.js"></script>
</body>
</html>
