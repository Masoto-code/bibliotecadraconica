<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Guilda - Biblioteca Dracônica</title>
    <link rel="stylesheet" href="../static/staticcss/theme.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../static/staticcss/style.css">
    <link rel="stylesheet" href="../css/style.css">
    <script>
        if (localStorage.getItem('tema') === 'claro') {
            document.documentElement.classList.add('light-theme');
        }
    </script>
    <style>
        .auth-container {
            max-width: 480px;
            margin: 50px auto 80px;
            padding: 0 20px;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 35px 30px;
            box-shadow: var(--shadow-md);
        }
        .auth-tabs {
            display: flex;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 25px;
        }
        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            margin-bottom: -2px;
            transition: all 0.2s;
        }
        .auth-tab.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--text-main);
            font-size: 0.95rem;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .avatar-picker {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .avatar-opt {
            font-size: 1.6rem;
            padding: 6px 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            cursor: pointer;
            background: var(--input-bg);
            transition: all 0.2s;
        }
        .avatar-opt.selected {
            border-color: var(--accent-color);
            transform: scale(1.1);
            background: var(--badge-bg);
        }
        .btn-submit {
            width: 100%;
            background: var(--accent-color);
            color: var(--accent-text);
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .btn-submit:hover {
            opacity: 0.95;
        }
        .feedback-msg {
            display: none;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
            font-size: 0.95rem;
            font-weight: 500;
        }
        .feedback-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #ef4444;
        }
        .feedback-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #22c55e;
            color: #22c55e;
        }
    </style>
</head>
<body>

    <!-- Cabeçalho -->
    <header class="navbar">
        <div class="logo">
            <a href="inicial.html" style="display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit;">
                <img class="logo2" src="../icones/logo.png" alt="Logo da Biblioteca Dracônica">
                <h1>BIBLIOTECA DRACÔNICA</h1>
            </a>
        </div>
        <nav>
            <a href="inicial.html">Início</a>
            <a href="index.html">Catálogo</a>
            <a href="forum.html">Fórum</a>
            <button id="theme-toggle" class="btn-theme">☀️ Tema Claro</button>
        </nav>
    </header>

    <main>
        <div class="auth-container">
            <div class="auth-card">
                <!-- Abas -->
                <div class="auth-tabs">
                    <button class="auth-tab active" id="tabLoginBtn">⚔️ Entrar na Guilda</button>
                    <button class="auth-tab" id="tabRegisterBtn">📜 Novo Aventureiro</button>
                </div>

                <div id="authFeedback" class="feedback-msg"></div>

                <!-- Formulário de Login -->
                <form id="formLogin">
                    <div class="form-group">
                        <label for="loginEmail">Email do Aventureiro:</label>
                        <input type="email" id="loginEmail" class="form-control" placeholder="seuemail@exemplo.com" required>
                    </div>

                    <div class="form-group">
                        <label for="loginSenha">Palavra-Passe (Senha):</label>
                        <input type="password" id="loginSenha" class="form-control" placeholder="Digite sua senha" required>
                    </div>

                    <button type="submit" class="btn-submit">Entrar na Guilda</button>
                    
                    <div style="margin-top: 18px; font-size: 0.85rem; color: var(--text-muted); text-align: center; border-top: 1px dashed var(--border-color); padding-top: 12px;">
                        Conta demonstrativa de Mestre: <br>
                        <strong>mestre@draconica.com</strong> / <strong>draconica123</strong>
                    </div>
                </form>

                <!-- Formulário de Registro -->
                <form id="formRegister" style="display: none;">
                    <div class="form-group">
                        <label for="regNome">Nome do seu Personagem / Jogador:</label>
                        <input type="text" id="regNome" class="form-control" placeholder="Ex: Gandalf, o Cinzento" required>
                    </div>

                    <div class="form-group">
                        <label>Escolha o seu Avatar:</label>
                        <div class="avatar-picker" id="avatarPicker">
                            <span class="avatar-opt selected" data-avatar="🧙‍♂️">🧙‍♂️</span>
                            <span class="avatar-opt" data-avatar="⚔️">⚔️</span>
                            <span class="avatar-opt" data-avatar="🏹">🏹</span>
                            <span class="avatar-opt" data-avatar="🛡️">🛡️</span>
                            <span class="avatar-opt" data-avatar="🐉">🐉</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Seu Email:</label>
                        <input type="email" id="regEmail" class="form-control" placeholder="aventureiro@reino.com" required>
                    </div>

                    <div class="form-group">
                        <label for="regSenha">Crie uma Palavra-Passe (Senha):</label>
                        <input type="password" id="regSenha" class="form-control" placeholder="Mínimo 4 caracteres" required>
                    </div>

                    <button type="submit" class="btn-submit">Cadastrar na Guilda</button>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Biblioteca Dracônica - Todos os direitos reservados</p>
    </footer>

    <!-- Scripts -->
    <script src="../static/staticjs/tema.js"></script>
    <script src="../js/tema.js"></script>
    <script src="../static/staticjs/auth.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabLogin = document.getElementById('tabLoginBtn');
            const tabReg = document.getElementById('tabRegisterBtn');
            const formLogin = document.getElementById('formLogin');
            const formReg = document.getElementById('formRegister');
            const feedback = document.getElementById('authFeedback');

            function showFeedback(msg, isSuccess) {
                feedback.textContent = msg;
                feedback.className = `feedback-msg ${isSuccess ? 'feedback-success' : 'feedback-error'}`;
                feedback.style.display = 'block';
            }

            tabLogin.addEventListener('click', () => {
                tabLogin.classList.add('active');
                tabReg.classList.remove('active');
                formLogin.style.display = 'block';
                formReg.style.display = 'none';
                feedback.style.display = 'none';
            });

            tabReg.addEventListener('click', () => {
                tabReg.classList.add('active');
                tabLogin.classList.remove('active');
                formReg.style.display = 'block';
                formLogin.style.display = 'none';
                feedback.style.display = 'none';
            });

            let selectedAvatar = '🧙‍♂️';
            const avatars = document.querySelectorAll('.avatar-opt');
            avatars.forEach(av => {
                av.addEventListener('click', () => {
                    avatars.forEach(a => a.classList.remove('selected'));
                    av.classList.add('selected');
                    selectedAvatar = av.getAttribute('data-avatar');
                });
            });

            formLogin.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('loginEmail').value.trim();
                const senha = document.getElementById('loginSenha').value;

                const res = await Auth.login(email, senha);
                if (res.sucesso) {
                    showFeedback(`✨ Bem-vindo(a), ${res.usuario.nome}! Redirecionando...`, true);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    showFeedback(res.erro || 'Falha ao autenticar.', false);
                }
            });

            formReg.addEventListener('submit', async (e) => {
                e.preventDefault();
                const nome = document.getElementById('regNome').value.trim();
                const email = document.getElementById('regEmail').value.trim();
                const senha = document.getElementById('regSenha').value;

                const res = await Auth.register(nome, email, senha, selectedAvatar);
                if (res.sucesso) {
                    showFeedback(`✨ Ficha criada com sucesso, ${res.usuario.nome}! Redirecionando...`, true);
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1200);
                } else {
                    showFeedback(res.erro || 'Falha ao cadastrar.', false);
                }
            });
        });
    </script>
</body>
</html>
